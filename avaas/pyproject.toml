[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "avaas"
version = "0.1.0"
description = "AVaaS - Agent Validator as a Service: a multi-tenant platform to test, evaluate, compare, and monitor AI agents before release."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary - Coforge TechCon 2026 Hackathon" }
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "httpx>=0.27.0",
    "SQLAlchemy>=2.0.29",
    "jsonschema>=4.21.1",
    "python-dotenv>=1.0.1",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
gemini = ["google-generativeai>=0.5.0"]
deepeval = ["deepeval>=1.0.0"]
langfuse = ["langfuse>=2.0.0"]
otel = ["opentelemetry-sdk>=1.24.0", "opentelemetry-exporter-otlp>=1.24.0"]
langsmith = ["langsmith>=0.1.0"]
dev = [
    "pytest>=8.1.1",
    "pytest-asyncio>=0.23.6",
    "pytest-cov>=5.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = [
    "ignore::pytest.PytestCollectionWarning",
]
