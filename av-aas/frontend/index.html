<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AVaaS - Agent Validator</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
<header>
  <h1>AVaaS <span>Agent Validator as a Service</span></h1>
  <p class="tagline">Test, evaluate, compare, and monitor AI agents before release.</p>
</header>

<main>
  <section class="panel">
    <h2>1. Onboard an Agent</h2>
    <form id="agent-form">
      <label>Name <input name="name" required placeholder="Support Bot" /></label>
      <label>Endpoint URL <input name="endpoint_url" required placeholder="http://localhost:9000/invoke" /></label>
      <label>Description <input name="description" placeholder="Customer support agent" /></label>
      <label>System prompt <textarea name="system_prompt" rows="2" placeholder="You are a helpful support agent..."></textarea></label>
      <label>Tools (JSON array) <textarea name="tools" rows="4">[
  {"name": "get_order_status", "description": "Look up an order's status", "parameters": {"type":"object","properties":{"order_id":{"type":"string"}},"required":["order_id"]}}
]</textarea></label>
      <button type="submit">Register Agent</button>
    </form>
    <div id="agent-result"></div>
  </section>

  <section class="panel">
    <h2>2. Run Validation</h2>
    <form id="run-form">
      <label>Agent ID <input name="agent_id" id="run-agent-id" required placeholder="agent_..." /></label>
      <label><input type="checkbox" name="is_baseline" /> Mark as baseline</label>
      <label>Explicit requirements (one per line, optional)
        <textarea name="explicit_requirements" rows="3"></textarea>
      </label>
      <button type="submit">Run Validation</button>
    </form>
    <div id="run-result"></div>
  </section>

  <section class="panel">
    <h2>3. Runs</h2>
    <button id="refresh-runs">Refresh</button>
    <div id="runs-list"></div>
  </section>
</main>

<script src="app.js"></script>
</body>
</html>
